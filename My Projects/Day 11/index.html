<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Continuation of the border tag</title>
  </head>
  <body>
    <div
      style="
        border: 10px dashed blue;
        border-radius: 200px;
        width: 200px;
        height: 200px;
      "
    ></div>
    <section
      style="
        border: 10px solid red;
        margin-top: 30px;
        margin-bottom: 30px;
        margin-left: 30px;
        margin-right: 30px;
      "
    >
      <p>My class is very fun.</p>
    </section>
    <h1>My teachers name is Uncle Mark Jogbodo.</h1>
    <section style="border: 10px solid hotpink; margin: 30px">
      <p>My class is very fun.</p>
    </section>
    <h1>My teachers name is Uncle Mark Jogbodo.</h1>
    <section style="border: 10px solid goldenrod; margin: 30px 10px 40px 50px">
      <p>My class is very fun.</p>
    </section>
    <h1>My teachers name is Uncle Mark Jogbodo.</h1>
    <section style="border: 10px solid green; margin: 30px 10px">
      <p>My class is very fun.</p>
    </section>
  </body>
</html>
