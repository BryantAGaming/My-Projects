<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let coins = +prompt("How much coins do you have ???")
        if (coins >= 100) {
            console.log("You get a Castle")
        }
        else if (coins > 50 && coins < 99) {
            console.log("You get a Forrest")
        }
        else if (coins >= 20 && coins < 49) {
            console.log("You get a Beach")
        }
        else {
            console.log("Get more coins")
        }
    </script>
</head>

</body>
</html>
