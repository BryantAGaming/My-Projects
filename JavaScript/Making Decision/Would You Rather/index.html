<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let eyeColor = prompt("What is your eye color ???")
        if (eyeColor === "Brown") {
            console.log("Brown Common. More detail... Brown (70%–80% globally): The most common human eye color, featuring high concentrations of melanin that absorb light. It provides natural protection against intense sunlight.");
        }
        if (eyeColor === "Blue") {
            console.log("Blue is Common. More detail... Blue (8%–10% globally): Contains very little melanin. The blue appearance is an optical illusion caused by Rayleigh scattering of light off collagen fibers in the stroma (no actual blue pigment exists.)");
        }
        if (eyeColor === "Hazel") {
            console.log("Hazel is Uncommon & Average. More detail... : A blend of green and brown, often featuring gold or orange flecks. They have moderate melanin levels and tend to shift appearance depending on ambient light.)");
        }
        if (eyeColor === "Amber") {
            console.log("Amber is Uncommon & Average. More detail... : Amber (approx. 5% globally): Solid golden, yellow, or copper tones driven by a yellow pigment called lipochrome with very little brown melanin.)");
        }
        if (eyeColor === "Gray") {
            console.log("Gray is Uncommon & Average. More detail... : Similar to blue eyes due to low melanin, but with extra collagen deposits in the front layer that scatter light equally, producing a smoky, silver, or gray hue.)");
        }
        if (eyeColor === "Green") {
            console.log("Green is Uncommon & Average. More detail... : Green (approx. 2% globally): The rarest of the non-mutated, mainstream colors. It results from a combination of a light yellowish lipochrome pigment and the scattering of blue light.)");
        }
        if (eyeColor === "Red" || eyeColor === "Pink" || eyeColor ==="Violet") {
            console.log(`${eyeColor.toUpperCase()} is Rare & Medical. More detail... :  (<1% globally):${eyeColor.toLowerCase()} caused by severe forms of albinism. With almost zero melanin in the iris, light reflects off the blood vessels at the back of the eye, making the eyes appear ${eyeColor.toLowerCase()} when mixed with internal light scattering.)`);
        }

        if (eyeColor === "Heterochromia") {
            console.log("Heterochromia is Rare & Medical. More detail... : Heterochromia (<1% globally): A trait where a person has different colors in the same eye (central or sectoral) or two completely different colored eyes due to uneven melanin distribution.)");
        }
        if (eyeColor === "Black") {
            console.log("Black is Rare & Medical. More detail... : True Black (0.001% globally): Extremely rare, usually associated with a medical condition like aniridia (the near-total absence of the iris), which leaves the large pupil wide open and completely black.)");
        }
    </script>
</head>

</html>
