<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let money = +prompt("How much $$$ do you have to get your scoops of ice-cream");
        if (money >= 1000) {
            console.log("You get 3 scoops of ice-cream.");
        }
        else if (money >= 600 && money < 999) {
            console.log("You get 2 scoops of ice-cream.");
        }
        else if (money >= 300 && money < 599) {
            console.log("You get 1 scoops of ice-cream.");
        }
        else {
            console.log("Sorry, get more money ...");
        }
    </script>
</head>

</body>
</html>
