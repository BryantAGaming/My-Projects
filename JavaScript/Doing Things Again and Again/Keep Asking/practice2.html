<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let i = 1;
        while (i <= 100) {
            console.log(i);
            if (i % 3 === 0 && i % 5 === 0) {
                console.log("You get a gift bag.");
            }
            else if (i % 5 === 0) {
                console.log("You get a chocolate.");
            }
            else if (i % 3 === 0) {
                console.log("You get lollipop.")
            }
            else {
                console.log("You get a ... nothing.");
            };
            i++
        };
    </script>
</head>
