<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let candy = 1;
        let total_sweet = 0;
        while (candy <= 6) {
            if (candy % 2 === 0) {
                console.log("sweet candy #", candy)
                total_sweet++
            }
            else {
                console.log("sour candy #", candy)
            };
            candy++
        };
    </script>
